# Secrets Hygiene Sweep — runs on a weekly schedule.
#
# This workflow:
# 1. Assumes an AWS IAM role via OIDC (no long-lived access keys)
# 2. Invokes the Lambda bridge with a "hygiene_sweep" payload
# 3. The agent scans for stale access keys and inactive roles
# 4. Creates a GitHub Issue for each finding
#
# Required setup:
# - GitHub OIDC provider configured in AWS
# - IAM role with trust policy for this repo and lambda:InvokeFunction permission
# - Lambda function deployed with AGENTCORE_RUNTIME_ENDPOINT configured
# - Repository variables: AWS_ROLE_ARN, LAMBDA_FUNCTION_NAME, AWS_REGION

name: Secrets Hygiene Sweep

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  id-token: write     # Required for OIDC
  contents: read      # Read repo contents
  issues: write       # Create remediation tickets

jobs:
  sweep-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263846838953:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Invoke Hygiene Sweep Agent
        run: |
          PAYLOAD=$(jq -n \
            --arg task_type "hygiene_sweep" \
            --arg repo "${{ github.repository }}" \
            --arg github_token "${{ github.token }}" \
            '{
              task_type: $task_type,
              repo: $repo,
              github_token: $github_token
            }')

          aws lambda invoke \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json

          echo "Hygiene sweep response:"
          cat /tmp/response.json | jq .

          # Check for errors in the response
          STATUS=$(cat /tmp/response.json | jq -r '.statusCode // 200')
          if [ "$STATUS" != "200" ]; then
            echo "::error::Hygiene sweep failed with status $STATUS"
            exit 1
          fi
