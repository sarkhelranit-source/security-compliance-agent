[project]
name = "security-compliance-agent"
version = "0.1.0"
description = "Security Compliance Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0",
    "litellm>=1.40.0",
    "boto3>=1.35.0",
    "requests>=2.31.0",
    "bedrock-agentcore>=1.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
